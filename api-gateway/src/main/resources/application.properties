server.port=8000

spring.application.name=api-gateway

# Kết nối đăng ký vào Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Bật Discovery Locator để Gateway tự động khám phá và route theo tên service trên Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# 1. Route cho Payment & Wallet Service
spring.cloud.gateway.routes[0].id=payment-service-routes
spring.cloud.gateway.routes[0].uri=lb://payment-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/payments/**, /api/v1/wallets/**

# 2. Route chính trỏ tới trip-service
spring.cloud.gateway.routes[1].id=trip-service-routes
spring.cloud.gateway.routes[1].uri=lb://trip-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/**, /ws/**

# Cấu hình CORS toàn cục cho Web UI
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false

